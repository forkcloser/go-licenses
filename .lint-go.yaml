# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out. `just do lint go` renders the two on every run
# (book/linting-go.md, "one baseline, per-project carve-outs"). Seeded once;
# the file is the project's own. Every key the overlay accepts is below, with
# what it does to the baseline; anything else is refused as baseline policy.
#
# golangci:
#   linters:
#     disable:                       # takes a linter out of the baseline's set
#       - zerologlint
#     enable:                        # adds one the baseline turns off
#       - godox
#     exclusions:
#       paths:                       # appends: files golangci-lint skips entirely
#         - third_party/
#       presets:                     # appends golangci-lint's exclusion presets
#         - comments
#       rules:                       # appends: linters, or a finding text, off under a path.
#         # The baseline exempts tests from gocognit, goconst, gosec,
#         # varnamelen and wrapcheck; anything else a project tolerates there
#         # is its own. The reviewed shape, to tailor: tests are black-box
#         # consumers, so the rules about API hygiene and production
#         # robustness do not apply to them, while the rules about correctness
#         # do (errcheck stays on: a test that ignores an error can pass for
#         # the wrong reason).
#         - path: _test\.go
#           linters:
#             - dupl # test cases are meant to look alike
#             - dupword # test data
#             - err113 # dynamic errors are fine in fixtures
#             - dogsled # multiple-return helpers are exercised for one value at a time
#             - noctx # no cancellation to propagate
#             - perfsprint # readability over allocations
#             - mnd # fixture values
#     settings:                      # per linter, merged key by key into the baseline's:
#       wrapcheck:                   #   a scalar overrides, a mapping recurses, a list appends,
#         ignore-package-globs:      #   a named entry (a revive rule) overrides its namesake
#           - github.com/example/project/*
#   formatters:
#     enable:                        # adds a formatter (the baseline runs gci, gofumpt, golines, goimports)
#       - swaggo
#     exclusions:
#       paths:                       # appends: files the formatters skip
#         - internal/generated/
#     settings:                      # per formatter, merged like the linters'
#       golines:
#         max-len: 100
#       gci:
#         sections:                  # go in before the module's own group: a sibling
#           - prefix(github.com/example-sibling)  # organization's imports group next to this one's
# licenses:
#   allowed:                         # replaces the baseline's list of accepted dependency licenses
#     - Apache-2.0
#     - MIT
#   ignore:                          # appends modules go-licenses skips (its known false positives)
#     - gotest.tools/v3
# nilaway:
#   blocking: false                  # findings print without failing the lane, while a backlog is worked off
#   exclude-pkgs:                    # appends package prefixes NilAway leaves out
#     - github.com/example/project/internal/generated
#   exclude-errors-in-files:         # appends file prefixes: NilAway has no per-line suppression
#     - internal/legacy/
golangci:
  linters:
    settings:
      depguard:
        rules:
          main:
            # The house command line: kong for the flags and commands,
            # primordium's logger (slog, tint on a terminal) and shutdown
            # (signals, exit status), not its whole app.
            allow:
              - github.com/alecthomas/kong
              - github.com/mycophonic/primordium/app/logger
              - github.com/mycophonic/primordium/app/shutdown
              # What go-licenses is built on: go/packages loads the
              # dependency graph, errgroup classifies its licence files
              # concurrently, x/text titles the licence types check prints,
              # and otiai10/copy writes save's tree.
              - golang.org/x/tools/go/packages
              - golang.org/x/sync/errgroup
              - golang.org/x/text/cases
              - golang.org/x/text/language
              - github.com/otiai10/copy
              # The vendored licence classifier's token diff and scoring.
              - github.com/sergi/go-diff/diffmatchpatch
    exclusions:
      rules:
        # TestLibrariesVendored loads a fixture module from its directory:
        # Libraries resolves packages from the working directory, which
        # t.Chdir sets for the whole process, so the test cannot run parallel.
        - path: ^licenses/library_test\.go$
          text: TestLibrariesVendored
          linters:
            - paralleltest
        # ---------------------------------------------------------------------------
        # ONBOARDING BACKLOG. Not a judgment: these are the findings the baseline
        # raised on code that predates it, exempted so the enrolment lands green
        # (book/mandatory-files.md, "Onboarding an existing repository"). Nobody has
        # read them yet. Alignment empties this block one linter or one package per
        # pull request, each finding fixed, silenced inline with its reason, or
        # raised as a rule; the last alignment pull request deletes the block.
        # Counts are the measurement at enrolment, per file and linter: 518 in 24 files.
        # ---------------------------------------------------------------------------
        - path: ^cmd/go-licenses/check\.go$
          linters: # 6 findings
            - wrapcheck # 2
            - err113 # 1
            - gocognit # 1
            - revive # 1
            - varnamelen # 1
        - path: ^cmd/go-licenses/e2e_test\.go$
          linters: # 6 findings
            - noctx # 3
            - paralleltest # 2
            - gochecknoglobals # 1
        - path: ^cmd/go-licenses/save\.go$
          linters: # 18 findings
            - wrapcheck # 8
            - revive # 3
            - err113 # 2
            - exhaustive # 2
            - gocognit # 1
            - gosec # 1
            - mnd # 1
        # The vendored licence classifier, measured when it came under the baseline.
        - path: ^internal/third_party/licenseclassifier/assets/embed\.go$
          linters: # 1 findings
            - varnamelen # 1
        - path: ^internal/third_party/licenseclassifier/classifier\.go$
          linters: # 9 findings
            - varnamelen # 8
            - gocognit # 1
        - path: ^internal/third_party/licenseclassifier/diff\.go$
          linters: # 1 findings
            - varnamelen # 1
        - path: ^internal/third_party/licenseclassifier/document\.go$
          linters: # 2 findings
            - varnamelen # 2
        - path: ^internal/third_party/licenseclassifier/frequencies\.go$
          linters: # 1 findings
            - varnamelen # 1
        - path: ^internal/third_party/licenseclassifier/scoring\.go$
          linters: # 4 findings
            - varnamelen # 3
            - gocognit # 1
        - path: ^internal/third_party/licenseclassifier/searchset\.go$
          linters: # 17 findings
            - varnamelen # 15
            - gocognit # 2
        - path: ^internal/third_party/licenseclassifier/tokenizer\.go$
          linters: # 13 findings
            - varnamelen # 10
            - gocognit # 3
        - path: ^licenses/classifier\.go$
          linters: # 8 findings
            - revive # 3
            - wrapcheck # 3
            - gosec # 1
            - iface # 1
        - path: ^licenses/classifier_test\.go$
          linters: # 4 findings
            - paralleltest # 2
            - err113 # 1
            - testpackage # 1
        - path: ^licenses/find\.go$
          linters: # 7 findings
            - wrapcheck # 3
            - varnamelen # 2
            - err113 # 1
            - gocritic # 1
        - path: ^licenses/find_test\.go$
          linters: # 22 findings
            - gocritic # 19
            - paralleltest # 2
            - testpackage # 1
        - path: ^licenses/library\.go$
          linters: # 8 findings
            - revive # 3
            - wrapcheck # 2
            - err113 # 1
            - gocognit # 1
            - varnamelen # 1
        - path: ^licenses/library_test\.go$
          linters: # 3 findings
            - paralleltest # 2
            - testpackage # 1
        - path: ^licenses/restrictiveness\.go$
          linters: # 9 findings
            - exhaustive # 4
            - revive # 4
            - gocritic # 1
        - path: ^licenses/types\.go$
          linters: # 3 findings
            - exhaustive # 1
            - gochecknoglobals # 1
            - revive # 1
        - path: ^licenses/types_test\.go$
          linters: # 2 findings
            - paralleltest # 1
            - testpackage # 1
